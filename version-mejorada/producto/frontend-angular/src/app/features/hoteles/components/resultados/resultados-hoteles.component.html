<app-buscador-dinamico [tipoBusqueda]="'hoteles'"></app-buscador-dinamico>

<div class="estado-busqueda" *ngIf="cargando" data-testid="resultados-cargando"><p>Buscando hoteles…</p></div>

<div class="no-results-message error" *ngIf="!cargando && error" data-testid="resultados-error" role="alert">
  <p>{{ error }}</p>
  <button type="button" class="btn-reintentar" (click)="reintentar()" data-testid="btn-reintentar">Reintentar</button>
</div>

<ng-container *ngIf="!cargando && !error">
  <app-resultados-lista *ngIf="resultadosItems.length > 0"
    [tipo]="'hoteles'" [items]="resultadosItems" [totalItems]="totalHoteles" [mostrarMas]="false" [itinerarioActivo]="false">
  </app-resultados-lista>

  <div *ngIf="resultadosItems.length === 0" class="no-results-message" data-testid="resultados-vacio">
    <p>No encontramos hoteles {{ ciudad ? 'en ' + ciudad : '' }}{{ checkInDate ? ' con disponibilidad para esas fechas' : '' }}.</p>
    <p class="sugerencia">Prueba otras fechas, otra ciudad o menos huéspedes por habitación.</p>
  </div>

  <nav class="paginacion" *ngIf="paginas().length > 1" data-testid="resultados-paginacion">
    <button [disabled]="page <= 1" (click)="irPagina(page - 1)" aria-label="Anterior">‹</button>
    <button *ngFor="let p of paginas()" [class.activo]="p === page" (click)="irPagina(p)" [attr.data-testid]="'resultados-pagina-' + p">{{ p }}</button>
    <button [disabled]="page >= lastPage" (click)="irPagina(page + 1)" aria-label="Siguiente">›</button>
  </nav>
</ng-container>
