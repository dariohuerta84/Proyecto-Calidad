<header class="encabezado">
  <div class="contenido-header">
    <div class="tourhotel">
      
      <!-- Lógica para Proveedores (Rol: 'proveedor') -->
      <ng-container *ngIf="isProveedor$ | async; else clienteLinks">
        <a routerLink="/proveedor" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }" class="somb" data-testid="nav-mis-publicaciones">
          <i class="fa-solid fa-list"></i> Mis publicaciones
        </a>
        <a routerLink="/proveedor/reservas" routerLinkActive="activo" class="somb" data-testid="nav-reservas-recibidas">
          <i class="fa-solid fa-inbox"></i> Reservas recibidas
        </a>
        <a routerLink="/proveedor/crear-hotel" routerLinkActive="activo" class="somb" data-testid="nav-crear-hotel">
          <i class="fa-solid fa-building-circle-check"></i> Crear Hotel
        </a>
        <a routerLink="/proveedor/crear-tour" routerLinkActive="activo" class="somb" data-testid="nav-crear-tour">
          <i class="fa-solid fa-square-plus"></i> Crear Tour
        </a>
      </ng-container>

      <!-- Lógica para Viajeros (Rol: 'viajero' o no logueado) -->
      <ng-template #clienteLinks>
        <a 
          routerLink="/tour" data-testid="nav-tours"
          routerLinkActive="activo" 
          [routerLinkActiveOptions]="{ exact: true }" 
          class="somb">
          <i class="fa-solid fa-location-dot"></i> Encontrar Tour
        </a>

        <a 
          routerLink="/hoteles" data-testid="nav-hoteles"
          routerLinkActive="activo" 
          [routerLinkActiveOptions]="{ exact: true }" 
          class="somb">
          <i class="fa-solid fa-bed"></i> Encontrar Hotel
        </a>
      </ng-template>

    </div>

    <div class="sesreg">
      
      <!-- Lógica: Usuario Autenticado -->
      <ng-container *ngIf="isAuthenticated$ | async; else authButtons">
        
        <div class="dropdown-usuario" [class.open]="menuOpen">
          <button class="bienvenida dropdown-toggle" data-testid="menu-usuario" (click)="toggleMenu($event)" [attr.aria-expanded]="menuOpen">
            Hola, 
            
            <!-- CORRECCIÓN CLAVE: Usamos 'currentUser$ | async as user' para acceder a las propiedades -->
            <ng-container *ngIf="currentUser$ | async as user">
                <!-- LÓGICA DE VISUALIZACIÓN DE NOMBRE SEGÚN ROL -->
                <ng-container *ngIf="user.rol === 'proveedor'; else travelerName">
                  <!-- Prioridad de Proveedor: 
                       1. empresa_nombre, 
                       2. nombre (por si usa su nombre personal), 
                       3. email (último recurso) -->
                  {{ user.empresa_nombre || user.nombre || user.email || 'Proveedor' }}
                </ng-container>

                <ng-template #travelerName>
                  <!-- Prioridad de Viajero: 1. nombre, 2. email (último recurso) -->
                  {{ user.nombre || user.email || 'Usuario' }}
                </ng-template>
            </ng-container>
            
            <i class="fa-solid fa-caret-down fa-xs"></i>
          </button>
          
          <div class="dropdown-menu" (click)="$event.stopPropagation()">
            <div class="dropdown-header">
              <ng-container *ngIf="currentUser$ | async as user">
                <div class="dropdown-name">{{ user.nombre || user.empresa_nombre || user.email }}</div>
              </ng-container>
            </div>

            <div class="account-links">
              <a routerLink="/editar-perfil" class="dropdown-item" data-testid="link-mi-cuenta">
                <i class="fa-solid fa-user"></i>
                <span class="item-label">Mi cuenta</span>
                <i class="fa-solid fa-chevron-right chevron"></i>
              </a>

              <ng-container *ngIf="!(isProveedor$ | async)">
                <a routerLink="/mis-reservas"
                   class="dropdown-item"
                   data-testid="link-mis-reservas"
                   [class.disabled]="isOnMisReservas"
                   [attr.aria-disabled]="isOnMisReservas"
                   (click)="isOnMisReservas && $event.preventDefault()">
                  <i class="fa-solid fa-calendar-check"></i>
                  <span class="item-label">Mis reservas</span>
                  <i class="fa-solid fa-chevron-right chevron"></i>
                </a>
              </ng-container>
            </div>

            <div class="dropdown-separator" aria-hidden="true"></div>

            <button (click)="logout()" class="dropdown-item" data-testid="btn-logout">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span class="item-label">Cerrar sesión</span>
            </button>
          </div>
        </div>
        
      </ng-container>

      <!-- Lógica: Usuario No Autenticado -->
      <ng-template #authButtons>
        <a routerLink="/auth/registro" [queryParams]="{ rol: 'proveedor' }" class="btn" data-testid="link-registro-proveedor">Registra tu alojamiento, proveedor</a>
        <a routerLink="/auth/login" class="btn" data-testid="link-login">Iniciar sesión</a>
        <a routerLink="/auth/registro" class="btn" data-testid="link-registro">Registrarse</a>
      </ng-template>

    </div>
  </div>
</header>
