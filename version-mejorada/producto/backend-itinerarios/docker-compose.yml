# Microservicio de itinerarios (FastAPI).
# Requisito: el backend Laravel ya levantado (crea la red "trouvels360_network" y la base MySQL).
services:
  itinerarios-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trouvels360-itinerarios
    ports:
      - "8001:8001"
    env_file:
      - .env.fastapi
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - trouvels360_network

networks:
  trouvels360_network:
    external: true
    name: trouvels360_network
