<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trouvels360 — Backlog TRV</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f7f8f9; --bg3:#f1f2f4; --line:#dcdfe4; --txt:#172b4d; --txt2:#44546f; --txt3:#626f86;
  --blue:#0c66e4; --blueBg:#e9f2ff; --sel:#e9f2ff; --side:#fafbfc; --card:#fff; --shadow:0 1px 1px #091e4240,0 0 1px #091e424f;
  --hi:#ae2e24; --hiBg:#ffeceb; --md:#a54800; --mdBg:#fff3eb; --lo:#216e4e; --loBg:#dcfff1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d2125; --bg2:#22272b; --bg3:#282e33; --line:#38414a; --txt:#dee4ea; --txt2:#b6c2cf; --txt3:#9fadbc;
    --blue:#579dff; --blueBg:#1c2b41; --sel:#1c2b41; --side:#1d2125; --card:#22272b; --shadow:0 0 0 1px #38414a;
    --hi:#ff9c8f; --hiBg:#42221f; --md:#fec195; --mdBg:#38291e; --lo:#7ee2b8; --loBg:#1c3329;
  }
}
:root[data-theme="dark"]{
  --bg:#1d2125; --bg2:#22272b; --bg3:#282e33; --line:#38414a; --txt:#dee4ea; --txt2:#b6c2cf; --txt3:#9fadbc;
  --blue:#579dff; --blueBg:#1c2b41; --sel:#1c2b41; --side:#1d2125; --card:#22272b; --shadow:0 0 0 1px #38414a;
  --hi:#ff9c8f; --hiBg:#42221f; --md:#fec195; --mdBg:#38291e; --lo:#7ee2b8; --loBg:#1c3329;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--txt);background:var(--bg)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px 10px;overflow:auto}
.proj{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.proj .logo{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#0c66e4,#6e5dc6);display:grid;place-items:center;color:#fff;font-weight:700}
.proj b{display:block;font-size:14px}.proj small{color:var(--txt3)}
.nav button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border:0;background:none;border-radius:4px;cursor:pointer;text-align:left;color:var(--txt2)}
.nav button:hover{background:var(--bg3)}
.nav button.on{background:var(--sel);color:var(--blue);font-weight:600}
.side-h{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin:18px 10px 6px}
.ep-f{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:4px;cursor:pointer;color:var(--txt2);font-size:13px}
.ep-f:hover{background:var(--bg3)} .ep-f.on{background:var(--sel);color:var(--txt)}
.dot{width:10px;height:10px;border-radius:2px;flex:none}
main{overflow:auto;display:flex;flex-direction:column}
.top{padding:20px 28px 0;position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.crumbs{color:var(--txt3);font-size:13px}
h1{font-size:24px;margin:4px 0 12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:14px}
.search{border:2px solid var(--line);background:var(--bg);color:var(--txt);border-radius:4px;padding:6px 10px;width:220px;max-width:100%}
.search:focus{outline:none;border-color:var(--blue)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:13px}
.chip.on{background:var(--blueBg);border-color:var(--blue);color:var(--blue)}
.stats{margin-left:auto;color:var(--txt3);font-size:13px}
.content{padding:20px 28px 60px}
/* Backlog */
.epic-block{border:1px solid var(--line);border-radius:6px;margin-bottom:16px;background:var(--bg2)}
.epic-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.epic-head .caret{transition:transform .15s;color:var(--txt3)}
.epic-block.closed .caret{transform:rotate(-90deg)} .epic-block.closed .rows{display:none}
.epic-tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;color:#fff}
.epic-head small{color:var(--txt3);margin-left:auto}
.rows{background:var(--bg);border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.row{display:grid;grid-template-columns:22px 82px 1fr auto auto auto 28px;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg3)}
.key{color:var(--txt3);font-size:13px}
.sum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:700}
.it.story{background:#22a06b}.it.task{background:#1d7afc}.it.sub{background:#8590a2}
.pts{background:var(--bg3);border-radius:10px;padding:0 8px;font-size:12px;color:var(--txt2);min-width:26px;text-align:center}
.prio{font-size:12px;padding:1px 6px;border-radius:3px;font-weight:600}
.p-Más.alta,.p-mas{color:var(--hi);background:var(--hiBg)}
.lbl{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--txt2);white-space:nowrap}
.avatar{width:24px;height:24px;border-radius:50%;background:#6e5dc6;color:#fff;display:grid;place-items:center;font-size:11px}
/* Board */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;align-items:start}
.col{background:var(--bg2);border-radius:6px;padding:8px;min-height:200px}
.col h3{font-size:12px;text-transform:uppercase;color:var(--txt3);margin:4px 6px 10px;letter-spacing:.03em}
.col.drag{outline:2px dashed var(--blue)}
.card{background:var(--card);box-shadow:var(--shadow);border-radius:4px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.card .t{margin-bottom:8px}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .meta .key{margin-left:auto}
.epic-mini{font-size:11px;padding:1px 6px;border-radius:3px;font-weight:600}
/* Trazabilidad */
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-size:13px}
th{background:var(--bg2);font-weight:600;color:var(--txt2);position:sticky;top:0}
td .tc{display:inline-block;font-size:11px;background:var(--bg3);border-radius:3px;padding:1px 5px;margin:1px;cursor:pointer}
.tc:hover{background:var(--blueBg);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi b{font-size:24px;display:block}.kpi span{color:var(--txt3);font-size:12px}
/* Panel de detalle */
.overlay{position:fixed;inset:0;background:#091e427a;display:none;z-index:10}
.overlay.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--bg);z-index:11;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.panel.on{box-shadow:-8px 0 24px #091e4233}
.panel.on{transform:none}
.ph{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.ph .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--txt3);padding:4px 8px;border-radius:4px}
.ph .x:hover{background:var(--bg3)}
.pb{display:grid;grid-template-columns:1fr 240px;gap:24px;padding:20px;overflow:auto}
.pb h2{font-size:22px;margin:0 0 14px}
.sec{margin-bottom:20px}
.sec h4{font-size:13px;margin:0 0 8px;color:var(--txt2)}
.story-line{background:var(--blueBg);border-left:3px solid var(--blue);padding:10px 12px;border-radius:3px}
.ca{border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:6px}
.ca .id{font-size:12px;font-weight:700;color:var(--txt3)}
.ca .g b{color:var(--blue);font-weight:600}
.ca .g{margin-top:2px}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--bg3);padding:1px 5px;border-radius:3px}
.side dl{margin:0;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.side dt{font-size:12px;color:var(--txt3);margin-top:8px}.side dt:first-child{margin-top:0}
.side dd{margin:2px 0 0}
.subtask{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:4px;margin-bottom:4px}
.subtask .tool{font-size:11px;border-radius:3px;padding:0 6px;font-weight:600}
.tool-Karate{background:#dcfff1;color:#216e4e}.tool-JMeter{background:#fff3eb;color:#a54800}.tool-Selenium{background:#e9f2ff;color:#0055cc}.tool-Appium{background:#f3f0ff;color:#5e4db2}
.subtask small{margin-left:auto;color:var(--txt3);font-size:11px;text-align:right}
ol,ul{margin:0;padding-left:20px} li{margin-bottom:4px}
.theme{margin-top:20px;width:100%;border:1px solid var(--line);background:none;border-radius:4px;padding:6px;cursor:pointer;color:var(--txt2)}
.hint{color:var(--txt3);font-size:12px;margin:0 0 12px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .top,.content{padding-left:16px;padding-right:16px}
  .row{grid-template-columns:22px 70px 1fr 28px}
  .row .hide-sm{display:none}
  .board{grid-template-columns:1fr}
  .pb{grid-template-columns:1fr}
  .mobnav{display:flex!important}
}
.mobnav{display:none;gap:6px;margin-bottom:10px}
</style>
</head>

    <div class="side-h">Épicas</div>
    <div id="epicFilters"></div>
    <button class="theme" id="themeBtn">Cambiar tema</button>
  </aside>
  <main>
    <div class="top">
      <div class="crumbs">Proyectos / Trouvels360 / <span id="crumb">Backlog</span></div>
      <h1 id="title">Backlog</h1>

        <button class="chip" data-tool="Appium">Appium</button>
        <span class="stats" id="stats"></span>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="overlay" id="ov"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true"></div>

const EP = Object.fromEntries(D.epicas.map(e => [e.key, e]));
const ALL = [...D.historias.map(h => ({...h, tipo: 'Historia'})), ...D.qa];
const BYKEY = Object.fromEntries(ALL.map(x => [x.key, x]));
const STATES = ['Por hacer', 'En curso', 'En pruebas', 'Hecho'];
let view = 'backlog', epicF = null, toolF = null, q = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch(e){ return d } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
let status = load('trv-status', {});

function prioCls(p){ return p === 'Más alta' || p === 'Alta' ? 'background:var(--hiBg);color:var(--hi)' : p === 'Media' ? 'background:var(--mdBg);color:var(--md)' : 'background:var(--loBg);color:var(--lo)'; }
function prio(p){ return `<span class="prio" style="${prioCls(p)}">${p === 'Más alta' ? '⇈ ' : p === 'Alta' ? '↑ ' : p === 'Media' ? '= ' : '↓ '}${esc(p)}</span>`; }
function icon(x){ return x.tipo === 'Historia' ? '<span class="it story" title="Historia">✓</span>' : '<span class="it task" title="Tarea">✔</span>'; }
function epicTag(k){ const e = EP[k]; return `<span class="epic-mini" style="background:${e.color}22;color:${e.color}">${esc(e.nombre)}</span>`; }

function match(x){
  if (epicF && x.epica !== epicF) return false;
  if (toolF){
    if (x.casos){ if (!x.casos.some(c => c.herramienta === toolF)) return false; }
    else if (!x.etiquetas.some(l => l.toLowerCase() === toolF.toLowerCase())) return false;
  }
  if (q){
    const hay = JSON.stringify(x).toLowerCase();
    if (!q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function renderEpicFilters(){
  const el = document.getElementById('epicFilters');
  el.innerHTML = `<div class="ep-f ${!epicF?'on':''}" data-e="">Todas las épicas</div>` + D.epicas.map(e =>
    `<div class="ep-f ${epicF===e.key?'on':''}" data-e="${e.key}"><span class="dot" style="background:${e.color}"></span>${esc(e.nombre)}</div>`).join('');
  el.querySelectorAll('.ep-f').forEach(n => n.onclick = () => { epicF = n.dataset.e || null; render(); });
}

function rowHTML(x){
  return `<div class="row" data-k="${x.key}">${icon(x)}<span class="key">${x.key}</span><span class="sum">${esc(x.resumen)}</span>
  <span class="hide-sm">${(x.canales||[]).map(c=>`<span class="lbl">${c}</span>`).join(' ')}</span>
  <span class="hide-sm">${prio(x.prioridad)}</span><span class="pts hide-sm">${x.puntos}</span>
  <span class="avatar" title="${esc(status[x.key]||'Por hacer')}">${(status[x.key]||'Por hacer')[0]}</span></div>`;
}

function backlog(){
  const parts = D.epicas.map(e => {
    const items = ALL.filter(x => x.epica === e.key && match(x));
    if (!items.length) return '';
    const pts = items.reduce((a, x) => a + x.puntos, 0);
    return `<div class="epic-block"><div class="epic-head"><span class="caret">▾</span>
      <span class="epic-tag" style="background:${e.color}">${e.key}</span><b>${esc(e.nombre)}</b>
      <small>${items.length} incidencias · ${pts} pts</small></div>
      <div class="rows">${items.map(rowHTML).join('')}</div></div>`;
  }).join('');
  return parts || '<p class="hint">No hay incidencias que coincidan con los filtros.</p>';
}

function board(){
  const items = ALL.filter(match);
  return `<p class="hint">Arrastra las tarjetas entre columnas; el estado se guarda en este navegador.</p><div class="board">${STATES.map(s => {
    const col = items.filter(x => (status[x.key] || 'Por hacer') === s);
    return `<div class="col" data-s="${s}"><h3>${s} · ${col.length}</h3>${col.map(x => `
      <div class="card" draggable="true" data-k="${x.key}"><div class="t">${esc(x.resumen)}</div>
      <div class="meta">${epicTag(x.epica)}${icon(x)}${prio(x.prioridad)}<span class="pts">${x.puntos}</span><span class="key">${x.key}</span></div></div>`).join('')}</div>`;
  }).join('')}</div>`;
}

function render(){
  const titles = {backlog:'Backlog', board:'Tablero', trace:'Trazabilidad', info:'Contexto y reglas'};
  document.getElementById('title').textContent = titles[view];
  document.getElementById('crumb').textContent = titles[view];
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  document.getElementById('toolbar').style.display = view === 'info' ? 'none' : 'flex';
  const n = ALL.filter(match);
  document.getElementById('stats').textContent = `${n.length} incidencias · ${n.reduce((a,x)=>a+x.puntos,0)} pts`;
  const c = document.getElementById('content');
  c.innerHTML = view === 'backlog' ? backlog() : view === 'board' ? board() : view === 'trace' ? trace() : info();
  c.querySelectorAll('.epic-head').forEach(h => h.onclick = () => h.parentElement.classList.toggle('closed'));
  c.querySelectorAll('.row,.card,.open,.tc').forEach(r => r.onclick = ev => { ev.preventDefault(); openIssue(r.dataset.k); });
  if (view === 'board') dnd(c);
  renderEpicFilters();
  document.getElementById('mobnav').innerHTML = ['backlog','board','trace','info'].map(v=>`<button class="chip ${v===view?'on':''}" data-mv="${v}">${titles[v]}</button>`).join('');
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { view = b.dataset.mv; render(); });
}

function dnd(root){
  root.querySelectorAll('.card').forEach(c => c.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', c.dataset.k)));
  root.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag'));
    col.addEventListener('drop', e => { e.preventDefault(); status[e.dataTransfer.getData('text/plain')] = col.dataset.s; save('trv-status', status); render(); });
  });
}

      <div class="g"><b>Dado</b> ${esc(c.dado)}</div><div class="g"><b>Cuando</b> ${esc(c.cuando)}</div><div class="g"><b>Entonces</b> ${esc(c.entonces)}</div></div>`).join('')}</div>
    <div class="sec"><h4>Endpoints</h4>${x.api.map(a=>`<div><code>${esc(a)}</code></div>`).join('')}</div>
    <div class="sec"><h4>Subtareas · casos de prueba (${x.casos.length})</h4>${x.casos.map(c=>`<div class="subtask"><span class="it sub">▢</span><span class="key">${c.id}</span>
      <span class="tool tool-${c.herramienta}">${c.herramienta}</span><span>${esc(c.titulo)}</span><small>${c.criterios.join('<br>')}</small></div>`).join('')}</div>`
  : `<div class="sec"><h4>Objetivo</h4><p>${esc(x.objetivo)}</p></div>
     <div class="sec"><h4>Criterios de aceptación</h4><ul>${x.criterios.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>
     <div class="sec"><h4>Entregable</h4><p>${esc(x.entregable)}</p></div>`;
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div class="ph"><span class="epic-tag" style="background:${e.color}">${e.key}</span><span class="crumbs">${esc(e.nombre)} / </span>${icon(x)}<b>${x.key}</b>
    <button class="x" aria-label="Cerrar">✕</button></div>
    <div class="pb"><div><h2>${esc(x.resumen)}</h2>${main}</div>
    <div class="side"><dl>
      <dt>Estado</dt><dd><select id="stSel" class="search" style="width:100%">${STATES.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></dd>
      <dt>Tipo</dt><dd>${esc(x.tipo)}</dd>
      <dt>Prioridad</dt><dd>${prio(x.prioridad)}</dd>
      <dt>Story points</dt><dd><span class="pts">${x.puntos}</span></dd>
      <dt>Épica</dt><dd>${epicTag(x.epica)}</dd>
      <dt>Componentes</dt><dd>${x.componentes.join(', ')}</dd>
      ${x.canales ? `<dt>Canales</dt><dd>${x.canales.map(c=>`<span class="lbl">${c}</span>`).join(' ')}</dd>` : ''}
      <dt>Etiquetas</dt><dd>${x.etiquetas.map(l=>`<span class="lbl">${esc(l)}</span>`).join(' ')}</dd>
      ${x.origen ? `<dt>HU de origen</dt><dd>${x.origen.join(', ')}</dd>` : ''}
    </dl></div></div>`;
  panel.classList.add('on'); document.getElementById('ov').classList.add('on');
  panel.querySelector('.x').onclick = closeIssue;
  panel.querySelector('#stSel').onchange = ev => { status[k] = ev.target.value; save('trv-status', status); render(); };
}
function closeIssue(){ document.getElementById('panel').classList.remove('on'); document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').onclick = closeIssue;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeIssue(); });
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
  toolF = toolF === b.dataset.tool ? null : b.dataset.tool;
  document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x.dataset.tool === toolF)); render();
});
document.getElementById('q').oninput = e => { q = e.target.value.trim(); render(); };
document.getElementById('themeBtn').onclick = () => {
  const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};
render();
</script>
</body>
</html>
