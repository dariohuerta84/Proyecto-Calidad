services:
  # Base de Datos MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: trouvels360_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trouvels360
      MYSQL_USER: trouvels_user
      MYSQL_PASSWORD: trouvels_pass
      MYSQL_ROOT_PASSWORD: trouvels_root
      MYSQL_INITDB_SKIP_TZINFO: 1
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - trouvels360_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - trouvels360_network

  # Backend Principal Laravel 11 (PHP 8.2 + Apache)
  backend:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: trouvels360_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend-laravel:/var/www/html
      - ./backend-laravel/docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    ports:
      - "8000:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trouvels360_network

  # Microservicio de Itinerarios (FastAPI Python)
  itinerarios:
    build:
      context: ./backend-itinerarios
      dockerfile: Dockerfile
    container_name: trouvels360_itinerarios
    restart: unless-stopped
    env_file:
      - ./backend-itinerarios/.env.fastapi
    volumes:
      - ./backend-itinerarios/app:/app/app
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - trouvels360_network

  # Frontend Web Angular
  frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile.dev
    container_name: trouvels360_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend-angular:/app
      - /app/node_modules
    networks:
      - trouvels360_network

volumes:
  trouvels360_mysql_data:

networks:
  trouvels360_network:
    name: trouvels360_network
    driver: bridge
