# Configuración de la suite móvil. Se pisa con -Dclave=valor o con variables de entorno (APPIUM_URL, APP, API_URL...).

# ---- Servidor Appium 2.x (driver uiautomator2 instalado: appium driver install uiautomator2)
appium.url=http://127.0.0.1:4723

# ---- Capabilities (UiAutomator2)
plataforma=Android
dispositivo=emulator-5554
# udid opcional (dispositivo físico): adb devices
udid=
version.android=
# Ruta del APK de depuración (./gradlew assembleDebug). Si queda vacía se abre la app ya instalada.
app=../../android/app/build/outputs/apk/debug/app-debug.apk
app.package=com.trouvels360.app
app.activity=com.trouvels360.app.MainActivity
# false = cada prueba empieza con la app limpia (sin sesión)
no.reset=false
nuevo.comando.timeout=120
espera.segundos=20
# Patrón de fecha del teclado del DatePicker de Material 3 según el idioma del emulador (en-US: MM/dd/yyyy, es: dd/MM/yyyy)
fecha.patron=MM/dd/yyyy

# ---- API (desde la PC que ejecuta las pruebas, para preparar datos). La app usa 10.0.2.2:8000 dentro del emulador.
api.url=http://localhost:8000/api

