# Propiedades de la corrida (se cargan con -q user.properties). Cualquier valor se puede pisar con -Jclave=valor.
host=localhost
port=8000
protocol=http
usuarios.login=50
rampa.login=10
iteraciones.login=3
usuarios.catalogo=100
usuarios.tours=100
rampa.catalogo=60
duracion=300
hilos.hotel=20
hilos.tour=30
cupo.tour=10
usuarios.panel=30
rampa.panel=15
iteraciones.panel=5

# Formato del .jtl: CSV con cabecera (lo usa verificar_resultados.py y el reporte HTML)
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.assertion_results_failure_message=true

# Reporte HTML: Apdex y percentiles alineados a los criterios (satisfecho <= 800 ms, tolerable <= 1500 ms)
jmeter.reportgenerator.apdex_satisfied_threshold=800
jmeter.reportgenerator.apdex_tolerated_threshold=1500
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99
jmeter.reportgenerator.report_title=Trouvels360 - Rendimiento y concurrencia (TRV-604)
jmeter.reportgenerator.overall_granularity=10000
