# Levanta LAS DOS APIs a la vez (Laravel + MySQL y Python) con un solo comando desde esta carpeta:
#   docker compose up -d --build                    → http://localhost:8000/api/ping y http://localhost:8001/api/health
#   docker compose --profile herramientas up -d     → además phpMyAdmin en http://localhost:8080
#   docker compose down                             → detiene las dos
# No duplica configuración: incluye el docker-compose.yml de cada API, y cada una sigue usando su propio archivo
# (api-laravel/.env y api-python/.env.fastapi). Cada carpeta también se puede levantar sola.
# Requiere Docker Compose 2.20 o superior (Docker Desktop actual ya lo trae).
name: trouvels360-backend

include:
  - api-laravel/docker-compose.yml
  - api-python/docker-compose.yml
